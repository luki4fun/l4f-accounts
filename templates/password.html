<section class="hero">
  <div class="wrap">
    <div class="panel narrow-s">
      <p class="crumb"><a href="{{ base }}">Your account</a> / <a href="{{ base }}/security">Security</a></p>
      <h1>{% if has_password %}Change your password{% else %}Set a password{% endif %}</h1>
      <p class="hint">Every other session is signed out, and remembered browsers are forgotten.</p>
      {% if let Some(e) = error %}<div class="notice mt-2" role="alert">{{ e }}</div>{% endif %}
      <form class="mt-2" method="post" action="{{ base }}/password">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input type="text" name="username" value="{{ username }}" autocomplete="username" hidden>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="{{ min_len }}" maxlength="{{ max_len }}" required autofocus>
          <p class="hint">At least {{ min_len }} characters.</p>
        </div>
        <button class="btn" type="submit">Save</button>
      </form>
    </div>
  </div>
</section>
