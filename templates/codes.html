<div class="wrap page">
<div class="panel read">
  <h1>Your recovery codes</h1>
  <div class="callout warn mt-2">
    <p>Save these now: they are shown only once. If you lose your phone or passkey, each one works once in place of the second step.</p>
  </div>
  <ul class="mono mt-2">
    {% for c in codes %}<li>{{ c }}</li>{% endfor %}
  </ul>
  <p class="mt-3"><a class="btn" href="{{ base }}/security">I saved them</a></p>
</div>
</div>
