[package]
name = "l4f-accounts"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false
description = "Users, roles, scopes and authentication for l4f (and later voipc)"

[features]
# The default build is the pure core: synchronous, no tokio, sqlx, axum or reqwest,
# so a non-HTTP server can use the verifiers, limiter and PoW directly.
default = []
mysql = ["dep:sqlx", "dep:tokio"]
axum = ["mysql", "dep:axum", "dep:askama"]
oauth = ["dep:reqwest", "dep:tokio"]
email = ["dep:lettre", "dep:tokio"]
# Only to verify a YOURLS-era bcrypt hash once and rehash it to Argon2id.
legacy-bcrypt = ["dep:bcrypt"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
ring = "0.17.14"
argon2 = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tracing = "0.1"

bcrypt = { version = "0.19", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "mysql", "derive", "macros", "migrate"], optional = true }
tokio = { version = "1", features = ["sync", "rt", "time", "macros"], optional = true }
axum = { version = "0.8", optional = true }
askama = { version = "0.16", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"], optional = true }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "rustls-platform-verifier"], optional = true }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Store race tests need two threads really running at once.
tokio = { version = "1", features = ["rt-multi-thread"] }
